name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Format check with ruff
      run: uv run ruff format --check .

    - name: Type check with mypy
      run: uv run mypy .

    - name: Run unit tests
      run: uv run pytest tests/unit/ -v --cov=src --cov-report=xml

    - name: Run integration tests
      run: uv run pytest tests/integration/ -v

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  smoke-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Run test training
      run: uv run langlab train --steps 50 --k 3 --v 8 --message-length 1 --seed 42 --heldout red,circle --eval-every 25

    - name: Verify outputs
      run: |
        test -f outputs/checkpoints/final_model.pt
        test -f outputs/metrics.csv
        uv run langlab eval --ckpt outputs/checkpoints/final_model.pt --split compo
        uv run langlab plot
        test -f outputs/training_curve.png

  build:
    runs-on: ubuntu-latest
    needs: [test, smoke-test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.11"

    - name: Build package
      run: uv build

    - name: Check package
      run: uvx twine check dist/*
